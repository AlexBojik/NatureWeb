<p class="layers">
  <mat-grid-list cols="4" rowHeight="100%">
    <mat-grid-tile colspan="1" rowspan="1">
      <app-tree-layers [checkbox]="false"></app-tree-layers>
      <ul class="my-0 list-group">
        <li>
        <button mat-button color="primary" (click)="add()" [disabled]="!(selected && selected.isGroup)">
          <mat-icon>add</mat-icon>
          Добавить слой
        </button>
        </li>
        <li>
        <button mat-button color="primary" (click)="addGroup()" [disabled]="!(isAddGroupEnabled)">
          <mat-icon>add</mat-icon>
          Добавить группу
        </button>
        </li>
      </ul>
    </mat-grid-tile>
    <mat-grid-tile colspan="3" rowspan="1">
      <app-layer-detail class="w-100"></app-layer-detail>
    </mat-grid-tile>
  </mat-grid-list>
</p>
